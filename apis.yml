name: Onefootball
description: 'Onefootball is a Berlin-based digital football (soccer) media platform
  that aggregates news, live scores, match coverage, video highlights, and streaming
  (OneFootball TV) for a global audience across iOS, Android, and the web. Backed by
  Earlybird and Union Square Ventures, the company partners with clubs, leagues, and
  publishers to distribute content and operates an official merchandise store and a
  Web3/club ecosystem. Onefootball does not publish a public developer API or partner
  developer portal; content ingestion for partners is handled via WordPress REST and
  private editorial integrations rather than an open, documented API surface.'
